<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer - シンプル版</title>
    
    <!-- Model-viewer CDN -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .model-container {
            position: relative;
        }
        
        model-viewer {
            width: 100%;
            height: 500px;
            background-color: #f8f9fa;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 249, 250, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            transition: opacity 0.3s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }
        
        .control-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .info {
            padding: 30px;
            text-align: center;
        }
        
        .info h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .info p {
            color: #666;
            line-height: 1.6;
            font-size: 1rem;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .feature {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .feature h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .feature p {
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            model-viewer {
                height: 400px;
            }
            
            .control-buttons {
                justify-content: center;
            }
            
            .btn {
                font-size: 0.8rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>3D チェアモデル</h1>
            <p>インタラクティブな3D表示</p>
        </div>
        
        <!-- 3Dモデル表示エリア -->
        <div class="model-container">
            <model-viewer 
                id="modelViewer"
                src="models/78962_forwebARrescale.glb"
                alt="3D Model"
                auto-rotate
                camera-controls
                environment-image="https://modelviewer.dev/shared-assets/environments/moon_1k.hdr"
                poster="https://modelviewer.dev/shared-assets/models/Astronaut.webp"
                shadow-intensity="1"
                loading="lazy">
                
                <!-- AR機能（対応デバイスのみ） -->
                <button slot="ar-button" class="btn">
                    ARで表示
                </button>
            </model-viewer>
            
            <!-- ローディングオーバーレイ -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <p>3Dモデルを読み込み中...</p>
            </div>
        </div>
        
        <!-- コントロール -->
        <div class="controls">
            <div class="control-buttons">
                <button class="btn" onclick="toggleAutoRotate()">自動回転 ON/OFF</button>
                <button class="btn" onclick="resetCamera()">カメラリセット</button>
                <button class="btn" onclick="takeScreenshot()">スクリーンショット</button>
            </div>
        </div>
        
        <!-- 商品情報 -->
        <div class="info">
            <h2>モダンチェア</h2>
            <p>
                インタラクティブな3Dチェアモデルです。マウスやタッチで自由に回転・ズームして、
                あらゆる角度から商品の詳細をご確認いただけます。
            </p>
            
            <!-- <div class="features">
                <div class="feature">
                    <div class="feature-icon">🖱️</div>
                    <h3>マウス操作</h3>
                    <p>ドラッグで回転、ホイールでズーム</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">📱</div>
                    <h3>タッチ操作</h3>
                    <p>タッチで回転、ピンチでズーム</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">🔄</div>
                    <h3>自動回転</h3>
                    <p>自動でモデルが回転表示</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">📐</div>
                    <h3>AR対応</h3>
                    <p>対応デバイスでAR表示</p>
                </div>
            </div> -->
        </div>
    </div>
    
    <script>
        const modelViewer = document.getElementById('modelViewer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        // ローディング完了時
        modelViewer.addEventListener('load', () => {
            console.log('3Dモデルの読み込み完了');
            loadingOverlay.classList.add('hidden');
        });
        
        // エラーハンドリング
        modelViewer.addEventListener('error', (event) => {
            console.error('モデル読み込みエラー:', event);
            loadingOverlay.innerHTML = '<p style="color: #e74c3c;">モデルの読み込みに失敗しました</p>';
        });
        
        // 自動回転の切り替え
        function toggleAutoRotate() {
            modelViewer.autoRotate = !modelViewer.autoRotate;
            console.log('自動回転:', modelViewer.autoRotate ? 'ON' : 'OFF');
        }
        
        // カメラリセット
        function resetCamera() {
            modelViewer.resetTurntableRotation();
            modelViewer.jumpCameraToGoal();
            console.log('カメラをリセットしました');
        }
        
        // スクリーンショット
        async function takeScreenshot() {
            try {
                const screenshot = await modelViewer.toDataURL();
                const link = document.createElement('a');
                link.href = screenshot;
                link.download = '3d-model-screenshot.png';
                link.click();
                console.log('スクリーンショットを保存しました');
            } catch (error) {
                console.error('スクリーンショットエラー:', error);
                alert('スクリーンショットの保存に失敗しました');
            }
        }
    </script>
</body>
</html>
